name: ss2-airflow-dbt
x-airflow: &airflow
  image: ss2-airflow-dbt:3.1.1
  build: ..
  user: "50000:0"
  restart: unless-stopped
  env_file: .env
  environment: &environment
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/workshop/current/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${METADATA_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${METADATA_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,estudiantes:viewer"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API__BASE_URL: https://${AIRFLOW_HOST}
    AIRFLOW__API__EXPOSE_CONFIG: "False"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "15"
    DBT_HOST: warehouse
    DBT_USER: sgfood
    DBT_DATABASE: sgfood_dw
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ../live:/opt/airflow/workshop:ro
    - ../logs:/opt/airflow/logs
    - ../auth:/opt/airflow/auth:ro
    - ../dbt_config:/opt/airflow/dbt_config:ro
    - ../scripts/runtime:/opt/airflow/lab_scripts:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${METADATA_PASSWORD}
      POSTGRES_DB: airflow
    volumes: ["metadata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 10
  warehouse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgfood
      POSTGRES_PASSWORD: ${DBT_PASSWORD}
      POSTGRES_DB: sgfood_dw
    volumes: ["warehouse:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood -d sgfood_dw"]
      interval: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["bash", "-c", "airflow db migrate && airflow pools set dbt_pool 2 'Ejecuciones dbt del taller'"]
    depends_on:
      postgres: {condition: service_healthy}
      warehouse: {condition: service_healthy}
      redis: {condition: service_healthy}
  airflow-api-server:
    <<: *airflow
    command: api-server
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 20
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 15s
      retries: 20
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}
  airflow-worker:
    <<: *airflow
    command: celery worker
    depends_on:
      airflow-api-server: {condition: service_healthy}
  airflow-triggerer:
    <<: *airflow
    command: triggerer
    depends_on:
      airflow-init: {condition: service_completed_successfully}
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      AIRFLOW_HOST: ${AIRFLOW_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      airflow-api-server: {condition: service_healthy}

volumes:
  metadata:
  warehouse:
  caddy-data:
  caddy-config:
