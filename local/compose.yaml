name: ss2-airflow-dbt-local

x-airflow: &airflow
  image: ss2-airflow-dbt-local:3.1.1
  build: ..
  pull_policy: build
  user: "50000:0"
  restart: unless-stopped
  environment: &environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/workshop/current/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,estudiantes:viewer"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ss2-local-jwt-demo-2026-not-for-production
    AIRFLOW__API__SECRET_KEY: ss2-local-api-demo-2026-not-for-production
    AIRFLOW__CORE__FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    AIRFLOW__API__BASE_URL: http://localhost:8084
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "10"
    DBT_HOST: warehouse
    DBT_USER: sgfood
    DBT_PASSWORD: sgfood_local
    DBT_DATABASE: sgfood_dw
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    AIRFLOW_CONN_WAREHOUSE_SGFOOD: '{"conn_type":"postgres","host":"warehouse","login":"sgfood","password":"sgfood_local","schema":"sgfood_dw","port":5432}'
  volumes:
    - ../dags:/opt/airflow/workshop/current/dags:ro
    - ../dbt:/opt/airflow/workshop/current/dbt:ro
    - ../dbt_config:/opt/airflow/dbt_config:ro
    - ./scripts:/opt/airflow/local:ro
    - logs:/opt/airflow/logs
    - auth:/opt/airflow/auth

services:
  prepare:
    image: ss2-airflow-dbt-local:3.1.1
    build: ..
    pull_policy: build
    user: "0:0"
    entrypoint: ["python", "/opt/airflow/local/prepare.py"]
    restart: "no"
    volumes:
      - ./scripts:/opt/airflow/local:ro
      - logs:/opt/airflow/logs
      - auth:/opt/airflow/auth
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local
      POSTGRES_DB: airflow
    volumes: ["metadata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20
  warehouse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgfood
      POSTGRES_PASSWORD: sgfood_local
      POSTGRES_DB: sgfood_dw
    volumes: ["warehouse:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood -d sgfood_dw"]
      interval: 5s
      retries: 20
  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["bash", "-c", "airflow db migrate && airflow pools set dbt_pool 2 'Tareas dbt locales'"]
    depends_on:
      prepare: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      warehouse: {condition: service_healthy}
  airflow-api-server:
    <<: *airflow
    command: api-server
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 30
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-api-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 10s
      retries: 30
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  metadata:
  warehouse:
  logs:
  auth:
